{% extends "base/stock_base.html" %}

{% block page_title %}⚠️ Anomalies qualité{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/qualite.css">
{% endblock %}

{% block stock_content %}
<div class="qualite-container">
    <div class="qualite-header">
        <h2>⚠️ Anomalies qualité</h2>
        <button class="btn btn-secondary" onclick="chargerAnomalies()">🔄 Rafraîchir</button>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-value" id="statEnAttente">0</div>
            <div class="stat-label">En attente</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statCorrige">0</div>
            <div class="stat-label">Corrigés</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Total anomalies</div>
        </div>
    </div>

    <div class="filters-bar">
        <input type="text" id="searchAnomalie" class="search-input" placeholder="🔍 Rechercher par référence..." onkeyup="filtrerAnomalies()">
        <select id="statusFilter" class="filter-select" onchange="filtrerAnomalies()">
            <option value="all">📊 Tous les statuts</option>
            <option value="en_attente">🟡 En attente</option>
            <option value="corrige">🟢 Corrigé</option>
        </select>
    </div>

    <div id="anomaliesList" class="anomalies-list">
        <div class="loading">⏳ Chargement des anomalies...</div>
    </div>
</div>

<!-- Modal Détail -->
<div id="modalDetail" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📋 Détail de l'anomalie</h3>
            <button class="modal-close" onclick="fermerModalDetail()">✕</button>
        </div>
        <div class="modal-body" id="modalDetailContent"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="fermerModalDetail()">Fermer</button>
        </div>
    </div>
</div>

<script>
let anomaliesList = [];

async function chargerAnomalies() {
    const container = document.getElementById('anomaliesList');
    container.innerHTML = '<div class="loading">⏳ Chargement...</div>';
    
    try {
        const response = await fetch('/api/qualite/anomalies', {
            credentials: 'include'
        });
        const data = await response.json();
        
        if (data.status === 'success') {
            anomaliesList = data.anomalies;
            afficherAnomalies();
            mettreAJourStats();
        } else {
            container.innerHTML = '<div class="empty-state">📭 Aucune anomalie trouvée</div>';
        }
    } catch(e) {
        console.error('Erreur:', e);
        container.innerHTML = '<div class="empty-state">❌ Erreur de chargement</div>';
    }
}

function afficherAnomalies() {
    const container = document.getElementById('anomaliesList');
    const search = document.getElementById('searchAnomalie').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;
    
    let filtered = anomaliesList.filter(a => {
        const matchSearch = a.facture?.reference?.toLowerCase().includes(search) || 
                           a.reception?.reference?.toLowerCase().includes(search);
        const matchStatus = status === 'all' || a.statut === status;
        return matchSearch && matchStatus;
    });
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">📭 Aucune anomalie trouvée</div>';
        return;
    }
    
    container.innerHTML = filtered.map(a => `
        <div class="anomalie-card">
            <div class="anomalie-header">
                <div class="anomalie-id">📋 ${a.id}</div>
                <div class="anomalie-date">📅 ${new Date(a.date_creation).toLocaleString()}</div>
                <div class="status-badge ${a.statut === 'en_attente' ? 'status-pending' : 'status-corrige'}">
                    ${a.statut === 'en_attente' ? '🟡 En attente' : '🟢 Corrigé'}
                </div>
            </div>
            <div class="anomalie-details">
                <div class="detail-item">
                    <span class="detail-label">📄 Facture:</span>
                    <span class="detail-value">${escapeHtml(a.facture?.reference || '-')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">📦 Réception:</span>
                    <span class="detail-value">${escapeHtml(a.reception?.reference || '-')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">👤 Client:</span>
                    <span class="detail-value">${escapeHtml(a.reception?.client || '-')}</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">⚠️ Manques:</span>
                    <span class="detail-value">${a.produits_manquants?.length || 0} produit(s)</span>
                </div>
            </div>
            <div class="produits-manquants">
                <div class="produits-manquants-title">📦 Produits manquants:</div>
                <div class="produits-list">
                    ${(a.produits_manquants || []).map(p => `
                        <span class="produit-tag">${escapeHtml(p.reference)}: -${Math.abs(p.difference)}</span>
                    `).join('')}
                </div>
            </div>
            <div class="anomalie-actions">
                <button class="btn btn-primary" onclick="voirDetail('${a.id}')">👁️ Voir détail</button>
            </div>
        </div>
    `).join('');
}

function mettreAJourStats() {
    const enAttente = anomaliesList.filter(a => a.statut === 'en_attente').length;
    const corrige = anomaliesList.filter(a => a.statut === 'corrige').length;
    
    document.getElementById('statEnAttente').textContent = enAttente;
    document.getElementById('statCorrige').textContent = corrige;
    document.getElementById('statTotal').textContent = anomaliesList.length;
}

function filtrerAnomalies() {
    afficherAnomalies();
}

function voirDetail(anomalieId) {
    const anomalie = anomaliesList.find(a => a.id === anomalieId);
    if (!anomalie) return;
    
    const modalContent = document.getElementById('modalDetailContent');
    modalContent.innerHTML = `
        <div class="correction-info">
            <div class="correction-info-row"><strong>ID:</strong> ${escapeHtml(anomalie.id)}</div>
            <div class="correction-info-row"><strong>Date création:</strong> ${new Date(anomalie.date_creation).toLocaleString()}</div>
            <div class="correction-info-row"><strong>Statut:</strong> ${anomalie.statut === 'en_attente' ? '🟡 En attente' : '🟢 Corrigé'}</div>
            ${anomalie.date_correction ? `<div class="correction-info-row"><strong>Date correction:</strong> ${new Date(anomalie.date_correction).toLocaleString()}</div>` : ''}
        </div>
        
        <h4>📄 Facture</h4>
        <div class="correction-info">
            <div class="correction-info-row"><strong>Référence:</strong> ${escapeHtml(anomalie.facture?.reference || '-')}</div>
            <div class="correction-info-row"><strong>Fichier:</strong> ${escapeHtml(anomalie.facture?.nom || '-')}</div>
        </div>
        
        <h4>📦 Réception</h4>
        <div class="correction-info">
            <div class="correction-info-row"><strong>Référence:</strong> ${escapeHtml(anomalie.reception?.reference || '-')}</div>
            <div class="correction-info-row"><strong>Client:</strong> ${escapeHtml(anomalie.reception?.client || '-')}</div>
            <div class="correction-info-row"><strong>Fichier original:</strong> ${escapeHtml(anomalie.reception?.fichier_original || '-')}</div>
            ${anomalie.reception?.fichier_modifie ? `<div class="correction-info-row"><strong>Fichier modifié:</strong> ${escapeHtml(anomalie.reception.fichier_modifie)}</div>` : ''}
        </div>
        
        <h4>📋 Produits manquants</h4>
        <table class="table">
            <thead>
                <tr>
                    <th>Référence</th>
                    <th>Produit</th>
                    <th>Qté facture</th>
                    <th>Qté reçue</th>
                    <th>Différence</th>
                </tr>
            </thead>
            <tbody>
                ${(anomalie.produits_manquants || []).map(p => `
                    <tr>
                        <td><strong>${escapeHtml(p.reference)}</strong></td>
                        <td>${escapeHtml(p.produit)}</td>
                        <td>${p.quantite_facture}</td>
                        <td>${p.quantite_reception}</td>
                        <td style="color: var(--danger);">-${Math.abs(p.difference)}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
        
        ${anomalie.corrections && anomalie.corrections.length > 0 ? `
            <h4>✅ Corrections appliquées</h4>
            <table class="table">
                <thead>
                    <tr>
                        <th>Référence</th>
                        <th>Ancienne qté</th>
                        <th>Nouvelle qté</th>
                        <th>Ancien état</th>
                        <th>Nouvel état</th>
                    </tr>
                </thead>
                <tbody>
                    ${anomalie.corrections.map(c => `
                        <tr>
                            <td><strong>${escapeHtml(c.reference)}</strong></td>
                            <td>${c.ancienne_quantite}</td>
                            <td style="color: var(--success);">${c.nouvelle_quantite}</td>
                            <td>${c.ancien_etat || '-'}</td>
                            <td>${c.nouvel_etat || '-'}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        ` : ''}
        
        ${anomalie.commentaire ? `<div class="correction-info"><strong>📝 Commentaire:</strong><br>${escapeHtml(anomalie.commentaire)}</div>` : ''}
    `;
    
    document.getElementById('modalDetail').style.display = 'flex';
}

function fermerModalDetail() {
    document.getElementById('modalDetail').style.display = 'none';
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, m => {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

chargerAnomalies();
</script>
{% endblock %}
