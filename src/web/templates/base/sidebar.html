<style>

  flex-direction: column;

  box-shadow: 2px 0 10px rgba(0,0,0,0.1);

/* Version réduite */

  width: 80px;
}

.sidebar.collapsed .logo-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .user-details,
.sidebar.collapsed .nav-section-title {
  display: none;
}

.sidebar.collapsed .nav-icon {
  font-size: 1.3rem;
  margin-right: 0;
}

.sidebar.collapsed .sidebar-header {
  justify-content: center;
}

/* En-tête sidebar */
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo-icon {
  font-size: 1.8rem;
}

.logo-text {
  font-weight: 700;
  font-size: 1.1rem;
  flex: 1;
  margin-left: 0.75rem;
  color: white;
}

/* Bouton collapse */
.sidebar-collapse {
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  cursor: pointer;
  font-size: 0.8rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.sidebar-collapse:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

/* ==================== SCROLLBAR ==================== */
.sidebar-nav {
  flex: 1;
  padding: 1rem 0.75rem;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.4) rgba(255,255,255,0.1);
}

/* WebKit (Chrome, Edge, Safari) */

.sidebar-nav::-webkit-scrollbar-track {

.sidebar-nav::-webkit-scrollbar-thumb {

  border-radius: 10px;
  transition: background 0.2s;

.sidebar-nav::-webkit-scrollbar-thumb:hover {

}

.sidebar-nav:active::-webkit-scrollbar-thumb {

/* Éléments de navigation */

  align-items: center;
  gap: 0.75rem;
  padding: 0.7rem 1rem;
  margin: 0.2rem 0;

}

.nav-label {

/* Pied de sidebar */

</style>

<script>
// Gestion du collapse
const sidebar = document.getElementById('sidebar');
const collapseBtn = document.getElementById('sidebarCollapse');
const mainContent = document.querySelector('.main-content');

// Charger l'état sauvegardé
const savedState = localStorage.getItem('sidebarCollapsed');
if (savedState === 'true') {
  sidebar.classList.add('collapsed');
  if (mainContent) mainContent.style.marginLeft = '80px';
  if (collapseBtn) collapseBtn.innerHTML = '▶';
}

// Écouteur collapse
if (collapseBtn) {
  collapseBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('sidebarCollapsed', isCollapsed);
      
      if (mainContent) {
          mainContent.style.marginLeft = isCollapsed ? '80px' : '280px';
      }
      collapseBtn.innerHTML = isCollapsed ? '▶' : '◀';
  });
}

// Mettre en surbrillance l'élément actif
const currentPath = window.location.pathname;
document.querySelectorAll('.nav-item').forEach(item => {
  const href = item.getAttribute('href');
  if (href && currentPath === href) {
      item.classList.add('active');
  }
});

// Déconnexion
document.getElementById('sidebarLogoutBtn')?.addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

// Charger les infos utilisateur
async function loadUserInfo() {
  try {
      const response = await fetch('/api/me');
      const data = await response.json();
      if (data.status === 'success') {
          document.getElementById('sidebarUsername').textContent = data.user.username;
          const roleLabels = { admin: 'Administrateur', stock: 'Responsable Stock', user: 'Utilisateur' };
          document.getElementById('sidebarUserRole').textContent = roleLabels[data.user.role] || data.user.role;
          const initial = data.user.username.charAt(0).toUpperCase();
          document.getElementById('sidebarAvatar').textContent = initial;
      }
  } catch(e) {
      console.error('Erreur chargement user:', e);
  }
}
loadUserInfo();
</script>
