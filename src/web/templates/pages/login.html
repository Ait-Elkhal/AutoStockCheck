{% extends "base.html" %}

{% block title %}Connexion - AutoStockCheck{% endblock %}

{% block content %}
<h1 style="color: white; margin-bottom: 30px;">🔐 Connexion</h1>

<div class="row">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <div class="card-title">Se connecter</div>
        
        <form id="loginForm" onsubmit="event.preventDefault(); login();">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <p>Pas encore de compte ? <a href="/register" style="color: var(--primary);">S'inscrire</a></p>
        </div>
        
        <div id="errorMsg" style="color: red; margin-top: 15px; text-align: center;"></div>
    </div>
</div>

<script>
async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    
    const result = await response.json();
    
    if (result.status === 'success') {
        localStorage.setItem('token', result.token);
        localStorage.setItem('user', JSON.stringify(result.user));
        window.location.href = '/dashboard';
    } else {
        document.getElementById('errorMsg').textContent = result.message;
    }
}
</script>
{% endblock %}
