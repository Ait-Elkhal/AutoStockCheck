<link rel="stylesheet" href="/static/css/membres.css">

<div class="membres-container">
    <!-- En-tête avec actions -->
    <div class="membres-header">
        <div>
            <h2>👥 Gestion des membres</h2>
            <p class="text-muted">Gérez les profils des membres de votre organisation</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="openMembreModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Nouveau membre
            </button>
            <div class="view-toggle">
                <button class="view-btn active" data-view="carousel" onclick="setView('carousel')">🎴 Cartes</button>
                <button class="view-btn" data-view="list" onclick="setView('list')">📋 Liste</button>
            </div>
        </div>
    </div>

    <!-- Filtres par équipe -->
    <div class="team-filters">
        <button class="team-filter active" data-team="all" onclick="filterByTeam('all')">🏢 Toutes les équipes</button>
        <button class="team-filter" data-team="direction" onclick="filterByTeam('direction')">👑 Direction</button>
        <button class="team-filter" data-team="stock" onclick="filterByTeam('stock')">🏭 Stock</button>
        <button class="team-filter" data-team="reception" onclick="filterByTeam('reception')">📥 Réception</button>
        <button class="team-filter" data-team="qualite" onclick="filterByTeam('qualite')">🔧 Qualité</button>
        <button class="team-filter" data-team="livraison" onclick="filterByTeam('livraison')">🚚 Livraison</button>
        <button class="team-filter" data-team="informatique" onclick="filterByTeam('informatique')">💻 Informatique</button>
    </div>

    <!-- ==================== VUE CARROUSEL ==================== -->
    <div id="carouselView" class="carousel-view">
        <button class="nav-arrow prev" onclick="prevMembre()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <div class="main-card" id="mainCard">
            <div class="main-card-inner">
                <div class="membre-avatar-large" id="membreAvatar">👤</div>
                <h2 id="membreNom">Nom du membre</h2>
                <div class="membre-role" id="membreRole">Rôle</div>
                <div class="membre-equipe" id="membreEquipe">Équipe</div>
                
                <div class="membre-details">
                    <div class="detail-item"><span class="detail-icon">📧</span><span id="membreEmail">email@example.com</span></div>
                    <div class="detail-item"><span class="detail-icon">📞</span><span id="membreTel">+212 6XX XXX XXX</span></div>
                    <div class="detail-item"><span class="detail-icon">🌍</span><span id="membreNationalite">Maroc</span></div>
                    <div class="detail-item"><span class="detail-icon">⚥</span><span id="membreSexe">Homme</span></div>
                    <div class="detail-item"><span class="detail-icon">📅</span><span id="membreDateEntree">01/01/2024</span></div>
                </div>
                
                <div class="membre-actions">
                    <button class="btn-cv" onclick="downloadCV(currentMembreId)">📄 Télécharger CV</button>
                    <button class="btn-edit" onclick="editMembre(currentMembreId)">✏️ Modifier</button>
                    <button class="btn-delete" onclick="deleteMembre(currentMembreId)">🗑️ Supprimer</button>
                </div>
            </div>
        </div>

        <button class="nav-arrow next" onclick="nextMembre()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
    </div>

    <!-- Mini-cartes horizontales -->
    <div class="thumbnails-container">
        <button class="thumb-prev" onclick="scrollThumbs(-1)">◀</button>
        <div class="thumbnails-wrapper" id="thumbnailsWrapper">
            <div class="thumbnails" id="thumbnails"></div>
        </div>
        <button class="thumb-next" onclick="scrollThumbs(1)">▶</button>
    </div>

    <!-- ==================== VUE LISTE ==================== -->
    <div id="listView" class="list-view" style="display: none;">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr><th>Avatar</th><th>Nom</th><th>Email</th><th>Téléphone</th><th>Rôle</th><th>Équipe</th><th>Nationalité</th><th>Sexe</th><th>Date</th><th>CV</th><th>Actions</th></tr>
                </thead>
                <tbody id="membresTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Ajout/Modification -->
<div id="membreModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">
            <h3 id="modalTitle">➕ Nouveau membre</h3>
            <button class="close-btn" onclick="closeMembreModal()">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editMembreId">
            <div class="form-row">
                <div class="form-group"><label>Nom complet *</label><input type="text" id="membreNomComplet" class="form-control" required></div>
                <div class="form-group"><label>Sexe</label><select id="membreSexeSelect" class="form-control"><option>Homme</option><option>Femme</option><option>Autre</option></select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Email *</label><input type="email" id="membreEmailSelect" class="form-control" required></div>
                <div class="form-group"><label>Téléphone</label><input type="tel" id="membreTelSelect" class="form-control"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Nationalité</label><input type="text" id="membreNationaliteSelect" class="form-control" placeholder="Maroc"></div>
                <div class="form-group"><label>Date d'entrée</label><input type="date" id="membreDateEntreeSelect" class="form-control"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Rôle</label><select id="membreRoleSelect" class="form-control"><option>Admin</option><option>Responsable Stock</option><option>Réceptionnaire</option><option>Qualité</option><option>Camionneur</option><option>Auditeur</option></select></div>
                <div class="form-group"><label>Équipe</label><select id="membreEquipeSelect" class="form-control"><option value="direction">Direction</option><option value="stock">Stock</option><option value="reception">Réception</option><option value="qualite">Qualité</option><option value="livraison">Livraison</option><option value="informatique">Informatique</option></select></div>
            </div>
            <div class="form-group"><label>CV (PDF)</label><input type="file" id="membreCV" accept=".pdf" class="form-control"></div>
            <div class="form-group"><label>Avatar</label><input type="file" id="membreAvatarFile" accept="image/*" class="form-control"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeMembreModal()">Annuler</button>
            <button class="btn btn-primary" onclick="saveMembre()">💾 Enregistrer</button>
        </div>
    </div>
</div>

<script src="/static/js/membres.js"></script>
