<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoStockCheck - Connexion</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 AutoStockCheck</h1>
            <p>Plateforme d'automatisation de la vérification des commandes</p>
            <div style="position: absolute; top: 20px; right: 20px;">
                <a href="/" style="color: white;">🏠 Accueil</a>
            </div>
        </div>

        <div class="row">
            <div class="card" style="max-width: 500px; margin: 0 auto;">
                <div class="card-title">🔐 Connexion</div>
                
                <form id="loginForm" onsubmit="event.preventDefault(); login();">
                    <div class="form-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
                </form>
                
                <div style="text-align: center; margin-top: 20px;">
                    <p>Pas encore de compte ? <a href="/register" style="color: var(--primary);">S'inscrire</a></p>
                    <p><a href="/" style="color: var(--gray);">← Retour à l'accueil</a></p>
                </div>
                
                <div id="errorMsg" style="color: red; margin-top: 15px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                window.location.href = '/dashboard';
            } else {
                document.getElementById('errorMsg').textContent = result.message;
            }
        }
    </script>
</body>
</html>
