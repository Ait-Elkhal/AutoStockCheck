<div class="users-section">
    <div class="users-header">
        <h2>👥 Gestion des utilisateurs</h2>
        <button class="btn btn-primary" onclick="window.location.href='/admin/user/add'">
            ➕ Nouvel utilisateur
        </button>
    </div>

    <!-- Filtres -->
    <div class="filters-bar">
        <input type="text" id="searchUser" class="input" placeholder="🔍 Rechercher..." onkeyup="filterUsers()">
        <select id="roleFilter" class="select" onchange="filterUsers()">
            <option value="all">Tous les rôles</option>
            <option value="admin">👑 Admin</option>
            <option value="stock">🏭 Stock</option>
            <option value="reception">📥 Réception</option>
            <option value="qualite">🔧 Qualité</option>
            <option value="user">👤 User</option>
        </select>
        <select id="statusFilter" class="select" onchange="filterUsers()">
            <option value="all">Tous statuts</option>
            <option value="actif">🟢 Actif</option>
            <option value="inactif">🔴 Inactif</option>
            <option value="pending">⏳ En attente</option>
        </select>
        <button class="btn btn-secondary" onclick="exportUsersCSV()">📎 Export CSV</button>
        <button class="btn btn-secondary" onclick="loadUsers()">🔄 Rafraîchir</button>
    </div>

    <!-- Tableau -->
    <div class="table-wrapper">
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom d'utilisateur</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Dernière connexion</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody">
                <tr><td colspan="7" class="text-center">⏳ Chargement...<\/td><\/tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let usersList = [];

// ==================== CHARGEMENT DES UTILISATEURS ====================
async function loadUsers() {
    const tbody = document.getElementById('usersTableBody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center">⏳ Chargement...<\/td><\/tr>';
    
    try {
        const response = await fetch('/api/admin/users', {
            credentials: 'include'
        });
        const data = await response.json();
        if (data.status === 'success') {
            usersList = data.users;
            displayUsers();
        } else {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">❌ Erreur: ' + (data.message || 'Inconnue') + '<\/td><\/tr>';
        }
    } catch(e) {
        console.error('Erreur loadUsers:', e);
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">❌ Erreur de connexion<\/td><\/tr>';
    }
}

function displayUsers() {
    const tbody = document.getElementById('usersTableBody');
    const search = document.getElementById('searchUser')?.value.toLowerCase() || '';
    const roleFilter = document.getElementById('roleFilter')?.value || 'all';
    const statusFilter = document.getElementById('statusFilter')?.value || 'all';
    
    let filtered = usersList.filter(function(u) {
        const matchSearch = (u.username || '').toLowerCase().includes(search) || (u.email || '').toLowerCase().includes(search);
        const matchRole = roleFilter === 'all' || u.role === roleFilter;
        const matchStatus = statusFilter === 'all' || u.statut === statusFilter;
        return matchSearch && matchRole && matchStatus;
    });
    
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">📭 Aucun utilisateur<\/td><\/tr>';
        return;
    }
    
    const roleLabels = {
        admin: '👑 Admin',
        stock: '🏭 Stock',
        reception: '📥 Réception',
        qualite: '🔧 Qualité',
        user: '👤 User'
    };
    
    const statusLabels = {
        actif: '🟢 Actif',
        inactif: '🔴 Inactif',
        pending: '⏳ En attente'
    };
    
    let html = '';
    for (let i = 0; i < filtered.length; i++) {
        const u = filtered[i];
        html += '<tr>' +
            '<td>' + u.id + '<\/td>' +
            '<td><strong>' + escapeHtml(u.username) + '<\/strong><\/td>' +
            '<td>' + escapeHtml(u.email) + '<\/td>' +
            '<td><span class="badge role-' + u.role + '">' + (roleLabels[u.role] || u.role) + '<\/span><\/td>' +
            '<td><span class="badge status-' + u.statut + '">' + (statusLabels[u.statut] || u.statut) + '<\/span><\/td>' +
            '<td>' + (u.last_login ? new Date(u.last_login).toLocaleDateString() : '-') + '<\/td>' +
            '<td>' +
                '<div class="action-buttons">' +
                    '<button class="btn-icon" onclick="editUser(' + u.id + ')" title="Modifier">✏️</button>' +
                    '<button class="btn-icon" onclick="resetPassword(' + u.id + ', \'' + escapeHtml(u.username) + '\')" title="Réinitialiser mot de passe">🔑</button>' +
                    (u.statut === 'actif' ? 
                        '<button class="btn-icon" onclick="toggleUserStatus(' + u.id + ', \'inactif\')" title="Désactiver">🔴</button>' : 
                        '<button class="btn-icon" onclick="toggleUserStatus(' + u.id + ', \'actif\')" title="Activer">🟢</button>'
                    ) +
                    '<button class="btn-icon" onclick="deleteUser(' + u.id + ', \'' + escapeHtml(u.username) + '\')" title="Supprimer">🗑️</button>' +
                '</div>' +
            '<\/td>' +
        '<\/tr>';
    }
    tbody.innerHTML = html;
}

function filterUsers() { displayUsers(); }

// ==================== ACTIONS ====================
function editUser(id) {
    window.location.href = '/admin/user/edit/' + id;
}

async function toggleUserStatus(id, newStatus) {
    try {
        const response = await fetch('/api/admin/users/' + id + '/status', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ statut: newStatus })
        });
        if (response.ok) {
            loadUsers();
        } else {
            showToast('Erreur lors du changement de statut', 'error');
        }
    } catch(e) {
        showToast('Erreur réseau', 'error');
    }
}

async function resetPassword(id, username) {
    if (confirm('Réinitialiser le mot de passe de ' + username + ' ?')) {
        try {
            const response = await fetch('/api/admin/users/' + id + '/reset-password', { 
                method: 'POST',
                credentials: 'include'
            });
            const result = await response.json();
            if (response.ok) {
                alert('✅ Nouveau mot de passe: ' + result.new_password);
                showToast('Mot de passe réinitialisé', 'success');
            } else {
                alert('❌ Erreur: ' + (result.error || 'Inconnue'));
            }
        } catch(e) {
            alert('❌ Erreur réseau');
        }
    }
}

async function deleteUser(id, username) {
    if (confirm('⚠️ Supprimer définitivement ' + username + ' ? Cette action est irréversible.')) {
        try {
            const response = await fetch('/api/admin/users/' + id, { 
                method: 'DELETE',
                credentials: 'include'
            });
            if (response.ok) {
                showToast('Utilisateur supprimé', 'success');
                loadUsers();
            } else {
                showToast('Erreur lors de la suppression', 'error');
            }
        } catch(e) {
            showToast('Erreur réseau', 'error');
        }
    }
}

function exportUsersCSV() {
    let csv = "ID,Username,Email,Role,Status,LastLogin\n";
    for (let i = 0; i < usersList.length; i++) {
        const u = usersList[i];
        csv += '"' + u.id + '","' + u.username + '","' + u.email + '","' + u.role + '","' + u.statut + '","' + (u.last_login || '') + '"\n';
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'utilisateurs_' + new Date().toISOString().split('T')[0] + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Export CSV terminé', 'success');
}

// ==================== UTILITAIRES ====================
function showToast(message, type) {
    let container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + (type || 'info');
    toast.innerHTML = '<span>' + message + '</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

// Initialisation
loadUsers();
</script>
