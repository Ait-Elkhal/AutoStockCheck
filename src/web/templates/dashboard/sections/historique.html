<link rel="stylesheet" href="/static/css/history.css">

<div class="history-section">
    <div class="history-header">
        <h2>📋 Centre d'historique unifié</h2>
        <div class="header-actions">
            <button class="notification-btn" onclick="toggleNotifications()">
                🔔
                <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
            </button>
            <button class="btn btn-secondary" onclick="rafraichirHistorique()">🔄 Rafraîchir</button>
        </div>
    </div>

    <!-- Onglets par type d'action -->
    <div class="history-tabs">
        <button class="tab-btn active" onclick="changerOnglet('all')">📊 Toutes les actions</button>
        <button class="tab-btn" onclick="changerOnglet('receptions')">📦 Réceptions</button>
        <button class="tab-btn" onclick="changerOnglet('comparaisons')">🔍 Comparaisons</button>
        <button class="tab-btn" onclick="changerOnglet('stocks')">🏭 Mouvements stock</button>
        <button class="tab-btn" onclick="changerOnglet('qualite')">🔧 Corrections qualité</button>
        <button class="tab-btn" onclick="changerOnglet('commandes')">📋 Commandes livraison</button>
    </div>

    <!-- Filtres -->
    <div class="history-filters">
        <div class="search-box">
            <input type="text" id="searchHistory" placeholder="🔍 Rechercher par référence, produit, responsable..." onkeyup="filtrerHistorique()">
        </div>
        <select id="filterStatus" class="filter-select" onchange="filtrerHistorique()">
            <option value="all">📊 Tous les statuts</option>
            <option value="en_attente">🟡 En attente</option>
            <option value="valide">✅ Validé</option>
            <option value="erreur">❌ Erreur</option>
            <option value="corrige">🔧 Corrigé</option>
        </select>
        <select id="filterUser" class="filter-select" onchange="filtrerHistorique()">
            <option value="all">👥 Tous les responsables</option>
        </select>
        <select id="filterDate" class="filter-select" onchange="filtrerHistorique()">
            <option value="all">📅 Toutes dates</option>
            <option value="today">Aujourd'hui</option>
            <option value="week">Cette semaine</option>
            <option value="month">Ce mois</option>
        </select>
        <button class="btn btn-primary" onclick="exporterHistoriqueCSV()">📎 Exporter CSV</button>
    </div>

    <!-- Statistiques -->
    <div class="stats-row" id="historyStats">
        <div class="stat-card"><div class="stat-value" id="statTotal">0</div><div class="stat-label">Total actions</div></div>
        <div class="stat-card"><div class="stat-value" id="statReceptions">0</div><div class="stat-label">Réceptions</div></div>
        <div class="stat-card"><div class="stat-value" id="statComparaisons">0</div><div class="stat-label">Comparaisons</div></div>
        <div class="stat-card"><div class="stat-value" id="statStock">0</div><div class="stat-label">Mouvements stock</div></div>
    </div>

    <!-- Liste historique -->
    <div id="historyList" class="history-table">
        <div style="text-align:center; padding:40px;">⏳ Chargement...</div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
</div>

<!-- Modal Détails -->
<div id="modalDetails" class="modal-details" style="display: none;">
    <div class="modal-details-content">
        <div class="modal-header">
            <h3>📋 Détails de l'action</h3>
            <button class="close-btn" onclick="fermerModalDetails()">✕</button>
        </div>
        <div class="modal-body" id="detailsContent"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="fermerModalDetails()">Fermer</button>
        </div>
    </div>
</div>

<!-- Notifications panel -->
<div id="notificationsPanel" class="notifications-panel">
    <div class="notifications-header">
        <span>🔔 Notifications</span>
        <button class="btn" onclick="toggleNotifications()" style="background: none; color: white;">✕</button>
    </div>
    <div id="notificationsList" class="notifications-list"></div>
</div>

<script>
    // ==================== DONNÉES ====================
    let historiqueComplet = [];
    let currentUser = JSON.parse(localStorage.getItem('user') || '{}');
    let currentUserRole = currentUser.role || 'user';
    let currentTab = 'all';
    let currentPage = 1;
    let itemsPerPage = 15;
    let notifications = [];

    // ==================== CHARGEMENT DE L'HISTORIQUE ====================
    async function chargerHistoriqueComplet() {
        console.log("🔄 Chargement historique complet...");
        
        const container = document.getElementById('historyList');
        if (container) container.innerHTML = '<div style="text-align:center; padding:40px;">⏳ Chargement...</div>';
        
        try {
            // Récupérer les commandes d'agenda
            const agendaCommands = JSON.parse(localStorage.getItem('agendaCommands') || '[]');
            
            // Récupérer les réceptions
            let receptions = [];
            if (window.AppData && window.AppData.commandesRecues) {
                receptions = window.AppData.commandesRecues;
            } else {
                const res = await fetch('/api/commandes-recues', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json();
                receptions = data.commandes || [];
            }
            
            // Récupérer les factures
            let factures = [];
            if (window.AppData && window.AppData.factures) {
                factures = window.AppData.factures;
            } else {
                const res = await fetch('/api/factures-recues', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json();
                factures = data.factures || [];
            }
            
            // Récupérer l'historique stock (localStorage)
            const stockHistorique = JSON.parse(localStorage.getItem('registreActions') || '[]');
            
            // Construire l'historique complet
            historiqueComplet = [];
            
            // 1. Commandes agenda
            agendaCommands.forEach(cmd => {
                historiqueComplet.push({
                    id: `cmd_${cmd.id}`,
                    type: 'commande',
                    reference: cmd.reference,
                    description: cmd.description || '',
                    statut: cmd.statut,
                    date: cmd.date,
                    heure: cmd.heure,
                    responsable: cmd.responsable || 'Non assigné',
                    client: cmd.client || '-',
                    payment: cmd.payment || 'unpaid',
                    details: cmd,
                    icone: '📋',
                    couleur: cmd.statut === 'validated' ? '#4caf50' : cmd.statut === 'pending' ? '#ffc107' : '#f44336'
                });
            });
            
            // 2. Réceptions
            receptions.forEach(rec => {
                historiqueComplet.push({
                    id: `rec_${rec.id}`,
                    type: 'reception',
                    reference: rec.reference,
                    description: `Réception de ${rec.produits?.length || 0} produits`,
                    statut: rec.statut || 'valide',
                    date: rec.dateReception || rec.date_ajout?.split('T')[0] || new Date().toISOString().split('T')[0],
                    heure: rec.date_ajout ? new Date(rec.date_ajout).toLocaleTimeString() : '-',
                    responsable: rec.ajoute_par || rec.ajoutePar || 'Employé',
                    client: rec.client || '-',
                    quantiteTotale: rec.produits?.reduce((s, p) => s + (p.quantite || 0), 0) || 0,
                    details: rec,
                    icone: '📦',
                    couleur: rec.statut === 'valide' ? '#4caf50' : '#ff9800'
                });
            });
            
            // 3. Factures
            factures.forEach(fact => {
                historiqueComplet.push({
                    id: `fact_${fact.id}`,
                    type: 'facture',
                    reference: fact.reference_reception,
                    description: `Facture ${fact.nom || ''}`,
                    statut: fact.statut || 'recue',
                    date: fact.date_ajout?.split('T')[0] || new Date().toISOString().split('T')[0],
                    heure: fact.date_ajout ? new Date(fact.date_ajout).toLocaleTimeString() : '-',
                    responsable: fact.ajoute_par || 'Direction',
                    lignes: fact.contenu?.lignes?.length || 0,
                    details: fact,
                    icone: '📄',
                    couleur: fact.statut === 'traite' ? '#4caf50' : fact.statut === 'en-attente' ? '#ffc107' : '#f44336'
                });
            });
            
            // 4. Historique stock
            stockHistorique.forEach(act => {
                historiqueComplet.push({
                    id: `stock_${act.id || Date.now()}_${Math.random()}`,
                    type: 'stock',
                    reference: act.reference || 'N/A',
                    description: act.action,
                    statut: 'valide',
                    date: act.date?.split('T')[0] || new Date().toISOString().split('T')[0],
                    heure: act.date ? new Date(act.date).toLocaleTimeString() : '-',
                    responsable: act.utilisateur || currentUser.username || 'Système',
                    quantite: act.quantite,
                    details: act,
                    icone: '🏭',
                    couleur: '#4361ee'
                });
            });
            
            // 5. Anomalies/Comparaisons (lecture depuis fichiers)
            await chargerAnomaliesHistorique();
            
            // Trier par date décroissante
            historiqueComplet.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Mettre à jour les filtres utilisateurs
            mettreAJourFiltresUtilisateurs();
            
            // Afficher
            afficherHistorique();
            mettreAJourStats();
            
        } catch (error) {
            console.error('Erreur chargement historique:', error);
            const container = document.getElementById('historyList');
            if (container) container.innerHTML = '<div style="text-align:center; padding:40px; color:#f44336;">❌ Erreur de chargement</div>';
        }
    }
    
    async function chargerAnomaliesHistorique() {
        try {
            const response = await fetch('/api/matching/anomalies/list', {
                headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
            });
            const data = await response.json();
            
            if (data.status === 'success') {
                data.anomalies.forEach(anom => {
                    historiqueComplet.push({
                        id: `anom_${anom.id}`,
                        type: 'anomalie',
                        reference: anom.facture_reference || anom.reception_reference,
                        description: `${anom.produits_count} anomalie(s) détectée(s)`,
                        statut: anom.statut,
                        date: anom.date_creation?.split('T')[0] || new Date().toISOString().split('T')[0],
                        responsable: 'Service Qualité',
                        details: anom,
                        icone: anom.statut === 'corrige' ? '✅' : '🔧',
                        couleur: anom.statut === 'corrige' ? '#4caf50' : '#ff9800'
                    });
                });
            }
        } catch (error) {
            console.error('Erreur chargement anomalies:', error);
        }
    }
    
    // ==================== FILTRES PAR RÔLE ====================
    function filtrerParRole(historique) {
        switch(currentUserRole) {
            case 'admin':
                // Admin voit tout
                return historique;
                
            case 'stock':
                // Responsable stock voit: réceptions, factures, comparaisons, mouvements stock
                return historique.filter(item => 
                    ['reception', 'facture', 'commande', 'comparaison', 'stock', 'anomalie'].includes(item.type)
                );
                
            case 'user':
                // Utilisateur standard voit seulement ses commandes et livraisons
                return historique.filter(item => 
                    (item.type === 'commande' && item.responsable === currentUser.username) ||
                    item.type === 'livraison'
                );
                
            default:
                return historique;
        }
    }
    
    // ==================== AFFICHAGE ====================
    function afficherHistorique() {
        let filtered = [...historiqueComplet];
        
        // Appliquer filtre par rôle
        filtered = filtrerParRole(filtered);
        
        // Appliquer filtre par onglet
        if (currentTab !== 'all') {
            filtered = filtered.filter(item => item.type === currentTab);
        }
        
        // Appliquer filtre recherche
        const searchTerm = document.getElementById('searchHistory')?.value.toLowerCase() || '';
        if (searchTerm) {
            filtered = filtered.filter(item => 
                (item.reference && item.reference.toLowerCase().includes(searchTerm)) ||
                (item.description && item.description.toLowerCase().includes(searchTerm)) ||
                (item.responsable && item.responsable.toLowerCase().includes(searchTerm)) ||
                (item.client && item.client.toLowerCase().includes(searchTerm))
            );
        }
        
        // Appliquer filtre statut
        const statusFilter = document.getElementById('filterStatus')?.value || 'all';
        if (statusFilter !== 'all') {
            filtered = filtered.filter(item => item.statut === statusFilter);
        }
        
        // Appliquer filtre utilisateur
        const userFilter = document.getElementById('filterUser')?.value || 'all';
        if (userFilter !== 'all') {
            filtered = filtered.filter(item => item.responsable === userFilter);
        }
        
        // Appliquer filtre date
        const dateFilter = document.getElementById('filterDate')?.value || 'all';
        filtered = filtrerParDate(filtered, dateFilter);
        
        // Pagination
        const total = filtered.length;
        const totalPages = Math.ceil(total / itemsPerPage);
        const start = (currentPage - 1) * itemsPerPage;
        const paginated = filtered.slice(start, start + itemsPerPage);
        
        // Afficher le tableau
        const container = document.getElementById('historyList');
        if (paginated.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;">📭 Aucune action trouvée</div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        
        container.innerHTML = `
            <table class="history-table-style">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Référence</th>
                        <th>Description</th>
                        <th>Responsable</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${paginated.map(item => `
                        <tr>
                            <td style="text-align:center; font-size:1.2rem;">${item.icone || getIconeParType(item.type)}</td>
                            <td>${item.date} ${item.heure ? `- ${item.heure}` : ''}</td>
                            <td><strong>${escapeHtml(item.reference || '-')}</strong></td>
                            <td>${escapeHtml(item.description || '-')}</td>
                            <td>${escapeHtml(item.responsable || '-')}</td>
                            <td>${getStatutBadge(item.statut, item.type)}</td>
                            <td>
                                <button class="action-btn view" onclick="voirDetails('${item.id}')">👁️ Détails</button>
                            </td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        `;
        
        // Pagination
        afficherPagination(totalPages);
    }
    
    function getIconeParType(type) {
        const icones = {
            'commande': '📋',
            'reception': '📦',
            'facture': '📄',
            'stock': '🏭',
            'anomalie': '🔧',
            'comparaison': '🔍'
        };
        return icones[type] || '📌';
    }
    
    function getStatutBadge(statut, type) {
        const classes = {
            'validated': 'status-validated',
            'valide': 'status-validated',
            'en_attente': 'status-pending',
            'pending': 'status-pending',
            'forgotten': 'status-forgotten',
            'traite': 'status-validated',
            'recue': 'status-pending',
            'corrige': 'status-validated'
        };
        
        const labels = {
            'validated': '✅ Validé',
            'valide': '✅ Validé',
            'en_attente': '🟡 En attente',
            'pending': '🟡 En attente',
            'forgotten': '🔴 Oublié',
            'traite': '✅ Traité',
            'recue': '📥 Reçu',
            'corrige': '🔧 Corrigé'
        };
        
        return `<span class="status-badge ${classes[statut] || 'status-pending'}">${labels[statut] || statut}</span>`;
    }
    
    function filtrerParDate(items, filter) {
        const now = new Date();
        const today = now.toISOString().split('T')[0];
        const weekAgo = new Date(now.setDate(now.getDate() - 7)).toISOString().split('T')[0];
        const monthAgo = new Date(now.setMonth(now.getMonth() - 1)).toISOString().split('T')[0];
        
        switch(filter) {
            case 'today':
                return items.filter(item => item.date === today);
            case 'week':
                return items.filter(item => item.date >= weekAgo);
            case 'month':
                return items.filter(item => item.date >= monthAgo);
            default:
                return items;
        }
    }
    
    function mettreAJourStats() {
        let filtered = filtrerParRole(historiqueComplet);
        
        document.getElementById('statTotal').textContent = filtered.length;
        document.getElementById('statReceptions').textContent = filtered.filter(i => i.type === 'reception').length;
        document.getElementById('statComparaisons').textContent = filtered.filter(i => i.type === 'anomalie' || i.type === 'comparaison').length;
        document.getElementById('statStock').textContent = filtered.filter(i => i.type === 'stock').length;
    }
    
    function mettreAJourFiltresUtilisateurs() {
        const users = [...new Set(historiqueComplet.map(item => item.responsable).filter(r => r))];
        const select = document.getElementById('filterUser');
        if (select) {
            select.innerHTML = '<option value="all">👥 Tous les responsables</option>';
            users.forEach(user => {
                select.innerHTML += `<option value="${escapeHtml(user)}">${escapeHtml(user)}</option>`;
            });
        }
    }
    
    function afficherPagination(totalPages) {
        const paginationDiv = document.getElementById('pagination');
        if (totalPages <= 1) {
            paginationDiv.innerHTML = '';
            return;
        }
        
        let html = '';
        if (currentPage > 1) {
            html += `<button onclick="changerPage(${currentPage - 1})">◀ Précédent</button>`;
        }
        
        for (let i = 1; i <= Math.min(totalPages, 5); i++) {
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="changerPage(${i})">${i}</button>`;
        }
        
        if (currentPage < totalPages) {
            html += `<button onclick="changerPage(${currentPage + 1})">Suivant ▶</button>`;
        }
        
        paginationDiv.innerHTML = html;
    }
    
    function changerPage(page) {
        currentPage = page;
        afficherHistorique();
    }
    
    // ==================== DÉTAILS ====================
    async function voirDetails(id) {
        const item = historiqueComplet.find(i => i.id === id);
        if (!item) return;
        
        const modalContent = document.getElementById('detailsContent');
        modalContent.innerHTML = `
            <div class="detail-card">
                <div class="detail-row">
                    <span class="detail-label">📅 Date :</span>
                    <span class="detail-value">${item.date} ${item.heure ? `à ${item.heure}` : ''}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">🏷️ Référence :</span>
                    <span class="detail-value"><strong>${escapeHtml(item.reference || '-')}</strong></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">📝 Description :</span>
                    <span class="detail-value">${escapeHtml(item.description || '-')}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">👤 Responsable :</span>
                    <span class="detail-value">${escapeHtml(item.responsable || '-')}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">📊 Statut :</span>
                    <span class="detail-value">${getStatutBadge(item.statut, item.type)}</span>
                </div>
                ${item.client ? `<div class="detail-row"><span class="detail-label">👥 Client :</span><span class="detail-value">${escapeHtml(item.client)}</span></div>` : ''}
                ${item.quantite ? `<div class="detail-row"><span class="detail-label">📦 Quantité :</span><span class="detail-value">${item.quantite}</span></div>` : ''}
            </div>
            ${item.details ? `<pre style="margin-top:15px; padding:10px; background:#f5f5f5; border-radius:8px; font-size:0.7rem; overflow-x:auto;">${JSON.stringify(item.details, null, 2)}</pre>` : ''}
        `;
        
        document.getElementById('modalDetails').style.display = 'flex';
    }
    
    function fermerModalDetails() {
        document.getElementById('modalDetails').style.display = 'none';
    }
    
    // ==================== NOTIFICATIONS ====================
    function toggleNotifications() {
        const panel = document.getElementById('notificationsPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }
    
    function afficherNotifications() {
        const container = document.getElementById('notificationsList');
        const unreadCount = notifications.filter(n => !n.read).length;
        const badge = document.getElementById('notificationBadge');
        
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
        
        if (notifications.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding:20px;">Aucune notification</p>';
            return;
        }
        
        container.innerHTML = notifications.map(notif => `
            <div class="notification-item ${!notif.read ? 'unread' : ''}" onclick="marquerCommeLu(${notif.id})">
                <div class="notification-title">${notif.message}</div>
                <div class="notification-date">${new Date(notif.date).toLocaleString()}</div>
            </div>
        `).join('');
    }
    
    function marquerCommeLu(id) {
        const notif = notifications.find(n => n.id === id);
        if (notif) notif.read = true;
        localStorage.setItem('notifications', JSON.stringify(notifications));
        afficherNotifications();
    }
    
    // ==================== EXPORT ====================
    function exporterHistoriqueCSV() {
        let csv = "Type,Date,Référence,Description,Responsable,Statut\n";
        let filtered = filtrerParRole(historiqueComplet);
        
        if (currentTab !== 'all') {
            filtered = filtered.filter(item => item.type === currentTab);
        }
        
        filtered.forEach(item => {
            csv += `"${item.type}","${item.date}","${item.reference || ''}","${item.description || ''}","${item.responsable || ''}","${item.statut}"\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `historique_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("📎 Historique exporté en CSV", "info");
    }
    
    // ==================== UTILITAIRES ====================
    function rafraichirHistorique() {
        currentPage = 1;
        chargerHistoriqueComplet();
    }
    
    function changerOnglet(onglet) {
        currentTab = onglet;
        currentPage = 1;
        
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        afficherHistorique();
    }
    
    function filtrerHistorique() {
        currentPage = 1;
        afficherHistorique();
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }
    
    function showToast(message, type) {
        const toast = document.getElementById('toastMessage');
        if (toast) {
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }
    }
    
    // ==================== INITIALISATION ====================
    document.addEventListener('DOMContentLoaded', () => {
        chargerHistoriqueComplet();
        afficherNotifications();
        
        // Écouter les mises à jour des données
        window.addEventListener('dataRefreshed', () => { chargerHistoriqueComplet(); });
        window.addEventListener('receptionsUpdated', () => { chargerHistoriqueComplet(); });
    });
    
    // Exposer les fonctions globalement
    window.rafraichirHistorique = rafraichirHistorique;
    window.filtrerHistorique = filtrerHistorique;
    window.exporterHistoriqueCSV = exporterHistoriqueCSV;
    window.toggleNotifications = toggleNotifications;
    window.voirDetails = voirDetails;
    window.fermerModalDetails = fermerModalDetails;
    window.changerPage = changerPage;
    window.changerOnglet = changerOnglet;
    window.marquerCommeLu = marquerCommeLu;
</script>
