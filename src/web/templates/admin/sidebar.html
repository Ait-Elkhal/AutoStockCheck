<script>
// Gestion du collapse
const sidebar = document.getElementById('adminSidebar');
const collapseBtn = document.getElementById('sidebarCollapse');
const adminMain = document.querySelector('.admin-main');

const savedState = localStorage.getItem('adminSidebarCollapsed');
if (savedState === 'true') {
    sidebar.classList.add('collapsed');
    if (adminMain) adminMain.style.marginLeft = '80px';
    if (collapseBtn) collapseBtn.innerHTML = '▶';
}

if (collapseBtn) {
    collapseBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
        const isCollapsed = sidebar.classList.contains('collapsed');
        localStorage.setItem('adminSidebarCollapsed', isCollapsed);
        if (adminMain) {
            adminMain.style.marginLeft = isCollapsed ? '80px' : '280px';
        }
        collapseBtn.innerHTML = isCollapsed ? '▶' : '◀';
    });
}

// Déconnexion
document.getElementById('sidebarLogoutBtn')?.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
});

// Charger infos utilisateur
async function loadUserInfo() {
    try {
        const response = await fetch('/api/me');
        const data = await response.json();
        if (data.status === 'success') {
            document.getElementById('sidebarUsername').textContent = data.user.username;
            const initial = data.user.username.charAt(0).toUpperCase();
            document.getElementById('sidebarAvatar').textContent = initial;
        }
    } catch(e) {}
}
loadUserInfo();
</script>
