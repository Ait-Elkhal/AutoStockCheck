<link rel="stylesheet" href="/static/css/matching.css">

<div class="matching-container">
    <div class="matching-header">
        <h2>🔍 Comparaison Facture / Réception</h2>
        <button class="btn" onclick="rafraichirListes()">🔄 Rafraîchir</button>
    </div>

    <div class="selection-row">
        <div class="selection-card">
            <h3>📄 Facture (Direction)</h3>
            <select id="selectFacture" class="form-control" onchange="chargerApercuFacture()">
                <option value="">-- Sélectionner une facture --</option>
            </select>
            <div id="factureInfo" class="file-info"></div>
        </div>
        <div class="selection-card">
            <h3>📦 Réception Réelle (Employé)</h3>
            <select id="selectReception" class="form-control" onchange="chargerApercuReception()">
                <option value="">-- Sélectionner une réception --</option>
            </select>
            <div id="receptionInfo" class="file-info"></div>
        </div>
    </div>

    <div id="refCommuneAlert" class="ref-alert" style="display:none;">
        <span id="refCommuneText"></span>
    </div>

    <div class="apercu-row">
        <div class="apercu-card"><h4>📊 Aperçu Facture</h4><div id="facturePreview">Aucune facture sélectionnée</div></div>
        <div class="apercu-card"><h4>📊 Aperçu Réception</h4><div id="receptionPreview">Aucune réception sélectionnée</div></div>
    </div>

    <div class="compare-section">
        <button class="btn btn-primary btn-compare" id="btnComparer" onclick="comparerAvecModele()" disabled>🔍 Comparer avec le modèle IA</button>
    </div>

    <div id="resultatsContainer" style="display:none;">
        <div class="resultats-header"><h3>📊 Résultats de la comparaison</h3><button class="btn" onclick="exporterResultats()">📎 Exporter CSV</button></div>
        <div id="resultatsStats" class="resultats-stats"></div>
        <div class="resultats-table-container">
            <table class="resultats-table">
                <thead><tr><th>Référence</th><th>Produit</th><th>Qté Facture</th><th>Qté Réception</th><th>Différence</th><th>Prédiction</th><th>Probabilité</th><th>Statut</th></tr></thead>
                <tbody id="resultatsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
    let factures = [];
    let commandesRecues = [];
    let factureSelectionnee = null;
    let receptionSelectionnee = null;
    let resultatsComparaison = [];

    // ==================== CHARGEMENT DEPUIS AppData ====================
    async function chargerFacturesAPI() {
        // Utiliser le service global si disponible
        if (window.AppData) {
            // S'abonner aux mises à jour des factures
            window.AppData.subscribe('factures', (facturesData) => {
                factures = facturesData;
                console.log("✅ Factures mises à jour:", factures.length);
                chargerListeFactures();
            });
            
            // Si déjà chargées, utiliser immédiatement
            if (window.AppData.factures.length) {
                factures = window.AppData.factures;
                console.log("✅ Factures chargées depuis AppData:", factures.length);
                chargerListeFactures();
            } else {
                // Forcer le chargement
                await window.AppData.loadFactures();
                factures = window.AppData.factures;
                console.log("✅ Factures chargées (forcé):", factures.length);
                chargerListeFactures();
            }
        } else {
            // Fallback API direct
            try {
                const res = await fetch('/api/factures-recues', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    factures = data.factures;
                    console.log("✅ Factures chargées (API direct):", factures.length);
                    chargerListeFactures();
                }
            } catch (e) {
                console.error("Erreur chargement factures:", e);
            }
        }
    }

    async function chargerReceptionsAPI() {
        // Utiliser le service global si disponible
        if (window.AppData) {
            // S'abonner aux mises à jour des commandes
            window.AppData.subscribe('commandes', (commandesData) => {
                commandesRecues = commandesData;
                console.log("✅ Réceptions mises à jour:", commandesRecues.length);
                chargerListeReceptions();
            });
            
            // Si déjà chargées, utiliser immédiatement
            if (window.AppData.commandesRecues.length) {
                commandesRecues = window.AppData.commandesRecues;
                console.log("✅ Réceptions chargées depuis AppData:", commandesRecues.length);
                chargerListeReceptions();
            } else {
                // Forcer le chargement
                await window.AppData.loadCommandes();
                commandesRecues = window.AppData.commandesRecues;
                console.log("✅ Réceptions chargées (forcé):", commandesRecues.length);
                chargerListeReceptions();
            }
        } else {
            // Fallback API direct
            try {
                const res = await fetch('/api/commandes-recues', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                const data = await res.json();
                if (data.status === 'success') {
                    commandesRecues = data.commandes || [];
                    console.log("✅ Réceptions chargées (API direct):", commandesRecues.length);
                    chargerListeReceptions();
                }
            } catch (e) {
                console.error("Erreur chargement réceptions:", e);
            }
        }
    }

    async function rafraichirListes() {
        console.log("🔄 Rafraîchissement des listes...");
        if (window.AppData) {
            await window.AppData.refreshAll();
            factures = window.AppData.factures;
            commandesRecues = window.AppData.commandesRecues;
        } else {
            await chargerFacturesAPI();
            await chargerReceptionsAPI();
        }
        chargerListeFactures();
        chargerListeReceptions();
    }

    function chargerListeFactures() {
        const select = document.getElementById('selectFacture');
        if (!select) return;
        
        select.innerHTML = '<option value="">-- Sélectionner une facture --</option>';
        
        if (!factures || factures.length === 0) {
            select.innerHTML = '<option value="">-- Aucune facture disponible --</option>';
            return;
        }
        
        // Filtrer les factures avec une référence valide
        const facturesValides = factures.filter(f => f.reference_reception);
        
        if (facturesValides.length === 0) {
            select.innerHTML = '<option value="">-- Aucune facture avec référence --</option>';
            return;
        }
        
        facturesValides.forEach(f => {
            const option = document.createElement('option');
            option.value = f.id;
            const ref = f.reference_reception || 'Sans réf';
            const nom = f.nom || 'Facture';
            const date = f.date_ajout ? new Date(f.date_ajout).toLocaleDateString() : '';
            option.textContent = `${nom} (${ref})${date ? ' - ' + date : ''}`;
            select.appendChild(option);
        });
        
        console.log("📋 Factures chargées dans select:", select.options.length - 1);
    }

    function chargerListeReceptions() {
        const select = document.getElementById('selectReception');
        if (!select) return;
        
        select.innerHTML = '<option value="">-- Sélectionner une réception --</option>';
        
        if (!commandesRecues || commandesRecues.length === 0) {
            select.innerHTML = '<option value="">-- Aucune réception disponible --</option>';
            return;
        }
        
        // Filtrer les réceptions avec une référence valide
        const receptionsValides = commandesRecues.filter(c => c.reference);
        
        if (receptionsValides.length === 0) {
            select.innerHTML = '<option value="">-- Aucune réception avec référence --</option>';
            return;
        }
        
        receptionsValides.forEach(c => {
            const option = document.createElement('option');
            option.value = c.id;
            const ref = c.reference || 'Sans réf';
            const nom = c.nom || 'Réception';
            const date = c.dateReception ? new Date(c.dateReception).toLocaleDateString() : '';
            option.textContent = `${nom} (${ref})${date ? ' - ' + date : ''}`;
            select.appendChild(option);
        });
        
        console.log("📋 Réceptions chargées dans select:", select.options.length - 1);
    }

    // ==================== APERÇUS ====================
    function chargerApercuFacture() {
        const id = document.getElementById('selectFacture').value;
        if (!id) {
            factureSelectionnee = null;
            document.getElementById('facturePreview').innerHTML = 'Aucune facture sélectionnée';
            document.getElementById('factureInfo').innerHTML = '';
            verifierRefCommune();
            return;
        }
        
        factureSelectionnee = factures.find(f => f.id == id);
        if (factureSelectionnee) {
            document.getElementById('factureInfo').innerHTML = `
                <strong>📄 Fichier:</strong> ${escapeHtml(factureSelectionnee.nom || '-')}<br>
                <strong>🏷️ Référence:</strong> ${escapeHtml(factureSelectionnee.reference_reception || '-')}<br>
                <strong>📅 Date:</strong> ${factureSelectionnee.date_ajout ? new Date(factureSelectionnee.date_ajout).toLocaleString() : '-'}<br>
                <strong>📊 Lignes:</strong> ${factureSelectionnee.contenu?.lignes?.length || 0}
            `;
            afficherApercuFacture();
        }
        verifierRefCommune();
    }

    function afficherApercuFacture() {
        const container = document.getElementById('facturePreview');
        if (!factureSelectionnee || !factureSelectionnee.contenu) {
            container.innerHTML = 'Aucune donnée disponible';
            return;
        }
        
        const headers = factureSelectionnee.contenu.en_tete || [];
        const lignes = factureSelectionnee.contenu.lignes || [];
        
        if (headers.length === 0 || lignes.length === 0) {
            container.innerHTML = 'Aucune donnée disponible';
            return;
        }
        
        let html = '<table class="preview-table" border="1" style="border-collapse:collapse; width:100%; font-size:0.7rem;">';
        html += '<thead><tr>' + headers.map(h => `<th style="border:1px solid #ddd; padding:5px;">${escapeHtml(h)}</th>`).join('') + '\%</thead>';
        html += '<tbody>';
        lignes.slice(0, 10).forEach(ligne => {
            html += '<tr>' + ligne.map(cell => `<td style="border:1px solid #ddd; padding:5px;">${escapeHtml(String(cell)) || '-'}${cell}</td>`).join('') + '</tr>';
        });
        if (lignes.length > 10) {
            html += `<tr><td colspan="${headers.length}" style="text-align:center;">... et ${lignes.length - 10} lignes supplémentaires</td></tr>`;
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function chargerApercuReception() {
        const id = document.getElementById('selectReception').value;
        if (!id) {
            receptionSelectionnee = null;
            document.getElementById('receptionPreview').innerHTML = 'Aucune réception sélectionnée';
            document.getElementById('receptionInfo').innerHTML = '';
            verifierRefCommune();
            return;
        }
        
        receptionSelectionnee = commandesRecues.find(c => c.id == id);
        if (receptionSelectionnee) {
            document.getElementById('receptionInfo').innerHTML = `
                <strong>📦 Fichier:</strong> ${escapeHtml(receptionSelectionnee.nom || '-')}<br>
                <strong>🏷️ Référence:</strong> ${escapeHtml(receptionSelectionnee.reference || '-')}<br>
                <strong>📅 Date:</strong> ${receptionSelectionnee.dateReception ? new Date(receptionSelectionnee.dateReception).toLocaleDateString() : '-'}<br>
                <strong>📊 Produits:</strong> ${receptionSelectionnee.produits?.length || 0}
            `;
            afficherApercuReception();
        }
        verifierRefCommune();
    }

    function afficherApercuReception() {
        const container = document.getElementById('receptionPreview');
        if (!receptionSelectionnee || !receptionSelectionnee.produits) {
            container.innerHTML = 'Aucune donnée disponible';
            return;
        }
        
        let html = '<table class="preview-table" border="1" style="border-collapse:collapse; width:100%; font-size:0.7rem;">';
        html += '<thead><tr><th>Référence</th><th>Produit</th><th>Quantité</th><th>État</th></thead>';
        html += '<tbody>';
        receptionSelectionnee.produits.slice(0, 10).forEach(p => {
            html += `<tr>
                <td style="border:1px solid #ddd; padding:5px;">${escapeHtml(p.reference)}</td>
                <td style="border:1px solid #ddd; padding:5px;">${escapeHtml(p.nom)}</td>
                <td style="border:1px solid #ddd; padding:5px;">${p.quantite}</td>
                <td style="border:1px solid #ddd; padding:5px;">${escapeHtml(p.etat) || '-'}</td>
            <tr>`;
        });
        if (receptionSelectionnee.produits.length > 10) {
            html += `<tr><td colspan="4" style="text-align:center;">... et ${receptionSelectionnee.produits.length - 10} produits supplémentaires</td></tr>`;
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function verifierRefCommune() {
        const btn = document.getElementById('btnComparer');
        const alertDiv = document.getElementById('refCommuneAlert');
        
        if (!factureSelectionnee || !receptionSelectionnee) {
            btn.disabled = true;
            alertDiv.style.display = 'none';
            return;
        }
        
        const refF = factureSelectionnee.reference_reception;
        const refR = receptionSelectionnee.reference;
        
        if (refF && refR && refF === refR) {
            btn.disabled = false;
            alertDiv.style.display = 'block';
            document.getElementById('refCommuneText').innerHTML = `✅ Les deux fichiers partagent la même référence : <strong>${refF}</strong>`;
        } else {
            btn.disabled = true;
            alertDiv.style.display = 'block';
            document.getElementById('refCommuneText').innerHTML = `⚠️ Références différentes : Facture (${refF || 'N/A'}) / Réception (${refR || 'N/A'})<br>Veuillez sélectionner des fichiers avec la même référence.`;
        }
    }

    // ==================== EXTRACTION ET COMPARAISON ====================
    function extraireDonneesFacture() {
        if (!factureSelectionnee || !factureSelectionnee.contenu) return [];
        
        const headers = factureSelectionnee.contenu.en_tete || [];
        const lignes = factureSelectionnee.contenu.lignes || [];
        
        let refIdx = -1, qteIdx = -1, nomIdx = -1;
        
        for (let i = 0; i < headers.length; i++) {
            const h = String(headers[i]).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (h.includes('reference') || h.includes('ref')) refIdx = i;
            if (h.includes('quantite') || h.includes('qty')) qteIdx = i;
            if (h.includes('nom') || h.includes('produit')) nomIdx = i;
        }
        
        return lignes.filter(l => refIdx !== -1 && l[refIdx]).map(l => ({
            reference: String(l[refIdx]).trim(),
            nom: nomIdx !== -1 ? l[nomIdx] : `Produit ${l[refIdx]}`,
            qteFacture: qteIdx !== -1 ? (parseInt(String(l[qteIdx]).replace(',', '.')) || 0) : 0
        }));
    }

    function extraireDonneesReception() {
        return receptionSelectionnee?.produits?.map(p => ({
            reference: p.reference,
            nom: p.nom,
            qteReception: p.quantite
        })) || [];
    }

    function fusionnerParReference(factureData, receptionData) {
        const resultats = [];
        const receptionMap = new Map(receptionData.map(r => [r.reference, r]));
        
        for (const f of factureData) {
            const r = receptionMap.get(f.reference);
            resultats.push({
                reference: f.reference,
                nom: f.nom,
                qteFacture: f.qteFacture,
                qteReception: r ? r.qteReception : 0
            });
            receptionMap.delete(f.reference);
        }
        
        for (const [ref, r] of receptionMap) {
            resultats.push({
                reference: ref,
                nom: r.nom,
                qteFacture: 0,
                qteReception: r.qteReception
            });
        }
        
        return resultats;
    }

    async function appelerModele(produit) {
        const diff = produit.qteReception - produit.qteFacture;
        const estManque = diff < 0;
        let probabilite;
        
        if (estManque) {
            const ratio = Math.abs(diff) / Math.max(produit.qteFacture, 1);
            probabilite = Math.min(0.98, 0.7 + ratio * 0.28);
        } else if (diff === 0) {
            probabilite = 0.95;
        } else {
            probabilite = 0.2;
        }
        
        return { prediction: estManque ? 1 : 0, probabilite };
    }

    async function comparerAvecModele() {
        if (!factureSelectionnee || !receptionSelectionnee) return;
        
        const btn = document.getElementById('btnComparer');
        btn.disabled = true;
        btn.innerHTML = '⏳ Analyse en cours...';
        
        const factureData = extraireDonneesFacture();
        const receptionData = extraireDonneesReception();
        const produits = fusionnerParReference(factureData, receptionData);
        
        resultatsComparaison = [];
        
        for (const p of produits) {
            const pred = await appelerModele(p);
            resultatsComparaison.push({
                reference: p.reference,
                produit: p.nom,
                quantiteFacture: p.qteFacture,
                quantiteReception: p.qteReception,
                difference: p.qteReception - p.qteFacture,
                prediction: pred.prediction,
                probabilite: pred.probabilite,
                statut: pred.prediction === 1 ? '⚠️ Manque' : '✅ Conforme'
            });
        }
        
        afficherResultats();
        
        btn.disabled = false;
        btn.innerHTML = '🔍 Comparer avec le modèle IA';
    }

    function afficherResultats() {
        const container = document.getElementById('resultatsContainer');
        const tbody = document.getElementById('resultatsBody');
        const statsDiv = document.getElementById('resultatsStats');
        
        const total = resultatsComparaison.length;
        const conformes = resultatsComparaison.filter(r => r.prediction === 0 && r.quantiteFacture > 0).length;
        const manques = resultatsComparaison.filter(r => r.prediction === 1).length;
        const nonFactures = resultatsComparaison.filter(r => r.quantiteFacture === 0 && r.quantiteReception > 0).length;
        const manquesReels = resultatsComparaison.filter(r => r.difference < 0).length;
        const probaMoy = resultatsComparaison.reduce((s, r) => s + r.probabilite, 0) / total;
        
        statsDiv.innerHTML = `
            <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Produits comparés</div></div>
            <div class="stat-card"><div class="stat-value conforme">${conformes}</div><div class="stat-label">Conformes</div></div>
            <div class="stat-card"><div class="stat-value manque">${manques}</div><div class="stat-label">Manques détectés</div></div>
            <div class="stat-card"><div class="stat-value ${nonFactures > 0 ? 'warning' : ''}">${nonFactures}</div><div class="stat-label">Non commandés</div></div>
            <div class="stat-card"><div class="stat-value ${manquesReels > 0 ? 'manque' : 'conforme'}">${manquesReels}</div><div class="stat-label">Manques réels</div></div>
            <div class="stat-card"><div class="stat-value">${(probaMoy * 100).toFixed(1)}%</div><div class="stat-label">Probabilité moyenne</div></div>
        `;
        
        tbody.innerHTML = resultatsComparaison.map(r => {
            const estNonFacture = r.quantiteFacture === 0 && r.quantiteReception > 0;
            const statutLibelle = estNonFacture ? "📦 Non commandé" : (r.prediction === 1 ? "⚠️ Manque" : "✅ Conforme");
            const statutClasse = estNonFacture ? "warning" : (r.prediction === 1 ? "manque" : "conforme");
            const diffColor = r.difference < 0 ? '#f44336' : r.difference > 0 ? '#ff9800' : '#666';
            const diffTexte = r.difference > 0 ? `+${r.difference}` : r.difference;
            
            return `
                <tr>
                    <td><strong>${escapeHtml(r.reference)}</strong></td>
                    <td>${escapeHtml(r.produit)}</td>
                    <td style="text-align:center">${r.quantiteFacture}</td>
                    <td style="text-align:center">${r.quantiteReception}</td>
                    <td style="text-align:center; color:${diffColor}">${diffTexte}</td>
                    <td style="text-align:center"><span class="status-${statutClasse}">${statutLibelle}</span></td>
                    <td style="text-align:center">${(r.probabilite * 100).toFixed(1)}%</td>
                    <td style="text-align:center">${r.prediction === 1 ? 'À traiter' : 'OK'}</td>
                </tr>
            `;
        }).join('');
        
        container.style.display = 'block';
        container.scrollIntoView({ behavior: 'smooth' });
    }

    function exporterResultats() {
        let csv = "Référence,Produit,Qté Facture,Qté Réception,Différence,Prédiction,Probabilité,Statut\n";
        resultatsComparaison.forEach(r => {
            let statut = r.quantiteFacture === 0 && r.quantiteReception > 0 ? "Non commandé" : (r.prediction === 1 ? "Manque" : "Conforme");
            csv += `"${r.reference}","${r.produit}",${r.quantiteFacture},${r.quantiteReception},${r.difference},${statut},${(r.probabilite * 100).toFixed(1)}%,${r.statut}\n`;
        });
        
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `comparaison_${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }

    // ==================== ÉCOUTEURS D'ÉVÉNEMENTS ====================
    window.addEventListener("receptionsUpdated", () => { 
        console.log("📢 Événement receptionsUpdated reçu");
        rafraichirListes(); 
    });
    window.addEventListener("facturesUpdated", () => { 
        console.log("📢 Événement facturesUpdated reçu");
        rafraichirListes(); 
    });
    
    // Initialisation
    rafraichirListes();

    window.rafraichirListes = rafraichirListes;
    window.chargerApercuFacture = chargerApercuFacture;
    window.chargerApercuReception = chargerApercuReception;
    window.comparerAvecModele = comparerAvecModele;
    window.exporterResultats = exporterResultats;
</script>
