<div class="logs-section">
    <div class="filters-bar">
        <input type="text" id="searchLog" class="input" placeholder="🔍 Rechercher..." onkeyup="filterLogs()">
        <select id="actionFilter" class="select" onchange="filterLogs()">
            <option value="all">Toutes actions</option>
            <option value="login">🔐 Connexion</option>
            <option value="logout">🚪 Déconnexion</option>
            <option value="create">➕ Création</option>
            <option value="update">✏️ Modification</option>
            <option value="delete">🗑️ Suppression</option>
        </select>
        <select id="daysFilter" class="select" onchange="loadLogs()">
            <option value="1">1 jour</option>
            <option value="7" selected>7 jours</option>
            <option value="15">15 jours</option>
            <option value="30">30 jours</option>
        </select>
        <button class="btn btn-secondary" onclick="exportLogs()">📎 Exporter CSV</button>
        <button class="btn btn-secondary" onclick="loadLogs()">🔄 Rafraîchir</button>
    </div>
    
    <div class="table-wrapper">
        <table class="table">
            <thead>
                <tr>
                    <th>Date/Heure</th>
                    <th>Utilisateur</th>
                    <th>Action</th>
                    <th>Détails</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr><td colspan="5" class="text-center">⏳ Chargement des logs...<\/td><\/tr>
            </tbody>
        </table>
    </div>
</div>

<script>
let logsData = [];

async function loadLogs() {
    const tbody = document.getElementById('logsTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="text-center">⏳ Chargement...<\/td><\/tr>';
    
    const days = document.getElementById('daysFilter')?.value || 7;
    
    try {
        const response = await fetch('/api/admin/logs?days=' + days);
        const data = await response.json();
        
        if (data.status === 'success') {
            logsData = data.logs || [];
            displayLogs();
        } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">❌ Erreur chargement<\/td><\/tr>';
        }
    } catch(e) {
        console.error('Erreur loadLogs:', e);
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">❌ Erreur connexion<\/td><\/tr>';
    }
}

function displayLogs() {
    const tbody = document.getElementById('logsTableBody');
    const search = document.getElementById('searchLog')?.value.toLowerCase() || '';
    const actionFilter = document.getElementById('actionFilter')?.value || 'all';
    
    let filtered = logsData.filter(function(l) {
        const matchSearch = (l.user_name || '').toLowerCase().includes(search) || (l.details || '').toLowerCase().includes(search);
        const matchAction = actionFilter === 'all' || l.action === actionFilter;
        return matchSearch && matchAction;
    });
    
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center">📭 Aucun log trouvé<\/td><\/tr>';
        return;
    }
    
    const actionLabels = {
        login: '🔐 Connexion',
        logout: '🚪 Déconnexion',
        create: '➕ Création',
        update: '✏️ Modification',
        delete: '🗑️ Suppression',
        reset_password: '🔑 Réinitialisation'
    };
    
    let html = '';
    for (var i = 0; i < filtered.length; i++) {
        var l = filtered[i];
        var actionLabel = actionLabels[l.action] || l.action;
        var date = l.created_at ? new Date(l.created_at).toLocaleString() : '-';
        
        html += '<tr>' +
            '<td>' + date + '<\/td>' +
            '<td><strong>' + escapeHtml(l.user_name || '-') + '<\/strong><br><small>' + escapeHtml(l.user_role || '-') + '<\/small><\/td>' +
            '<td>' + actionLabel + '<\/td>' +
            '<td>' + escapeHtml(l.details || '-') + '<\/td>' +
            '<td>' + escapeHtml(l.ip_address || '-') + '<\/td>' +
        '<\/tr>';
    }
    tbody.innerHTML = html;
}

function filterLogs() { displayLogs(); }

async function exportLogs() {
    const days = document.getElementById('daysFilter')?.value || 30;
    
    try {
        const response = await fetch('/api/admin/logs/export?days=' + days);
        const data = await response.json();
        
        if (data.status === 'success' && data.csv) {
            const blob = new Blob([data.csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = data.filename || 'logs_' + new Date().toISOString().split('T')[0] + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Export CSV terminé', 'success');
        } else {
            showToast('Erreur lors de l\'export', 'error');
        }
    } catch(e) {
        console.error('Erreur export:', e);
        showToast('Erreur de connexion', 'error');
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showToast(message, type) {
    let container = document.getElementById('toastContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
    }
    
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.innerHTML = '<span>' + message + '</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>';
    container.appendChild(toast);
    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 5000);
}

// Charger les logs au chargement
loadLogs();
</script>

    padding: 0.5rem 0.75rem;

    position: fixed;

    display: flex;
    flex-direction: column;

}

        align-items: stretch;
    }
    
    .filters-bar .input,

    }

    .table td {

    }

</style>
