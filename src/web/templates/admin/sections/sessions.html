<div class="sessions-section">
    <div class="sessions-stats">
        <div class="stat-card">
            <div class="stat-value" id="sessionCount">0</div>
            <div class="stat-label">Sessions actives</div>
        </div>
    </div>
    
    <div class="sessions-list" id="sessionsList">
        <div class="loading">Chargement...</div>
    </div>
</div>

<script>
async function loadSessions() {
    try {
        const response = await fetch('/api/admin/sessions');
        const data = await response.json();
        if (data.status === 'success') {
            const sessions = data.sessions || [];
            document.getElementById('sessionCount').textContent = sessions.length;
            
            const container = document.getElementById('sessionsList');
            if (sessions.length === 0) {
                container.innerHTML = '<div class="empty-sessions">🟢 Aucune session active</div>';
                return;
            }
            
            container.innerHTML = sessions.map(s => `
                <div class="session-card">
                    <div class="session-info">
                        <div class="session-user">
                            <span class="user-avatar">👤</span>
                            <strong>${escapeHtml(s.username)}</strong>
                            <span class="badge role-${s.role}">${s.role}</span>
                        </div>
                        <div class="session-details">
                            <div>📍 IP: ${s.ip_address || 'Inconnue'}</div>
                            <div>🔐 Connecté le: ${new Date(s.login_at).toLocaleString()}</div>
                            <div>🕐 Dernière activité: ${new Date(s.last_activity).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="session-actions">
                        <button class="btn btn-danger btn-sm" onclick="revokeSession(${s.id})">🚫 Révoquer</button>
                    </div>
                </div>
            `).join('');
        }
    } catch(e) { console.error(e); }
}

async function revokeSession(sessionId) {
    if (confirm('Révoquer cette session ?')) {
        const response = await fetch(`/api/admin/sessions/${sessionId}/revoke`, { method: 'POST' });
        if (response.ok) {
            showToast('Session révoquée', 'success');
            loadSessions();
        } else {
            showToast('Erreur', 'error');
        }
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
}

loadSessions();
// Rafraîchir toutes les 30 secondes
setInterval(loadSessions, 30000);
</script>

}
