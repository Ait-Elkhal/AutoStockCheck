<div class="admin-dashboard">
    <div class="chart-row">
        <div class="chart-card">
            <h3>📈 Évolution des connexions</h3>
            <canvas id="evolutionChart" height="200"></canvas>
        </div>
        <div class="chart-card">
            <h3>🥧 Répartition des utilisateurs</h3>
            <canvas id="repartitionChart" height="200"></canvas>
        </div>
    </div>
    <div class="activity-card">
        <h3>🕐 Dernières activités</h3>
        <div id="adminActivities" class="activity-list">
            <div class="loading">Chargement...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
async function loadDashboardData() {
    try {
        const response = await fetch('/api/admin/stats');
        const data = await response.json();
        if (data.status === 'success') {
            // Graphique évolution
            const ctx1 = document.getElementById('evolutionChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
                    datasets: [{
                        label: 'Connexions',
                        data: [5, 8, 12, 9, 15, 6, 4],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });
            
            // Graphique répartition
            const ctx2 = document.getElementById('repartitionChart').getContext('2d');
            new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ['Admin', 'Stock', 'User'],
                    datasets: [{
                        data: [1, 0, 0],
                        backgroundColor: ['#ef4444', '#f59e0b', '#4f46e5']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
    } catch(e) { console.error(e); }
    
    // Charger activités
    try {
        const response = await fetch('/api/activities');
        const data = await response.json();
        const container = document.getElementById('adminActivities');
        if (data.activities && data.activities.length > 0) {
            container.innerHTML = data.activities.map(a => `
                <div class="activity-item">
                    <span class="activity-icon">${a.action === 'Entrée' ? '📥' : '📤'}</span>
                    <span class="activity-text">${a.product} - ${a.action} de ${a.quantity} unités</span>
                    <span class="activity-date">${a.date}</span>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<div class="empty-activities">Aucune activité récente</div>';
        }
    } catch(e) {
        document.getElementById('adminActivities').innerHTML = '<div class="empty-activities">Aucune activité</div>';
    }
}

loadDashboardData();
</script>

<style>
.admin-dashboard {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
}

.chart-card, .activity-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
}

.chart-card h3, .activity-card h3 {
    margin-bottom: 1rem;
    font-size: 1rem;
}

.activity-list {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.activity-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem;
    background: var(--border-light);
    border-radius: 8px;
}

.activity-icon {
    font-size: 1.2rem;
}

.activity-text {
    flex: 1;
}

.activity-date {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.loading, .empty-activities {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
}

@media (max-width: 768px) {
    .chart-row {
        grid-template-columns: 1fr;
    }
}
</style>
