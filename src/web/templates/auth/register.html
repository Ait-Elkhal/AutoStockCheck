<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoStockCheck - Inscription</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 AutoStockCheck</h1>
            <p>Plateforme d'automatisation de la vérification des commandes</p>
            <div style="position: absolute; top: 20px; right: 20px;">
                <a href="/" style="color: white;">🏠 Accueil</a>
            </div>
        </div>

        <div class="row">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-title">📝 Inscription</div>
                
                <form id="registerForm" onsubmit="event.preventDefault(); register();">
                    <div class="form-group">
                        <label>Nom d'utilisateur *</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe *</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmer le mot de passe *</label>
                        <input type="password" id="confirm_password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Nom de l'entreprise *</label>
                        <input type="text" id="company" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Type de stockage</label>
                        <select id="storage_type" class="form-control">
                            <option value="entrepôt">Entrepôt centralisé</option>
                            <option value="magasin">Magasin de détail</option>
                            <option value="entrepôt_froid">Entrepôt frigorifique</option>
                            <option value="cross_docking">Cross-docking</option>
                            <option value="e_commerce">E-commerce</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Email du responsable stock</label>
                        <input type="email" id="email_stock" class="form-control">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%;">S'inscrire</button>
                </form>
                
                <div style="text-align: center; margin-top: 20px;">
                    <p>Déjà un compte ? <a href="/login" style="color: var(--primary);">Se connecter</a></p>
                    <p><a href="/" style="color: var(--gray);">← Retour à l'accueil</a></p>
                </div>
                
                <div id="errorMsg" style="color: red; margin-top: 15px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <script>
        async function register() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                document.getElementById('errorMsg').textContent = 'Les mots de passe ne correspondent pas';
                return;
            }
            
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                company: document.getElementById('company').value,
                storage_type: document.getElementById('storage_type').value,
                email_stock: document.getElementById('email_stock').value
            };
            
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                window.location.href = '/login';
            } else {
                document.getElementById('errorMsg').textContent = result.message;
            }
        }
    </script>
</body>
</html>
