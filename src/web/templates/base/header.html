<!-- Header - Barre supérieure -->
<header class="top-bar">
  <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      ☰
  </button>

  <div class="page-title">
      <h1 id="pageTitle">Dashboard</h1>
  </div>

  <div class="header-right">
      <!-- Recherche -->
      <div class="search-wrapper">
          <input type="text" id="globalSearch" class="search-input" placeholder="Rechercher...">
          <span class="search-icon">🔍</span>
      </div>

      <!-- Notifications -->
      <div class="notification-wrapper">
          <button class="notification-btn" id="notifBell">
              🔔
              <span id="notifBadge" class="notification-badge"></span>
          </button>
          <div id="notificationsPanel" class="notifications-panel">
              <div class="notifications-header">
                  <span>🔔 Notifications</span>
                  <button id="markAllRead" class="mark-read-btn">Tout marquer comme lu</button>
              </div>
              <div id="notificationsList" class="notifications-list">
                  <div class="notification-empty">Aucune notification</div>
              </div>
          </div>
      </div>

      <!-- Profil -->
      <div class="profile-wrapper">
          <button class="profile-btn" id="profileBtn">
              <div class="profile-avatar" id="userAvatar">👤</div>
              <span class="profile-name" id="userName">Chargement...</span>
              <span class="dropdown-arrow">▼</span>
          </button>
          <div id="profileDropdown" class="profile-dropdown">
              <div class="dropdown-header">
                  <div class="dropdown-avatar" id="dropdownAvatar">👤</div>
                  <div class="dropdown-user-info">
                      <div class="dropdown-username" id="dropdownUsername">Utilisateur</div>
                      <div class="dropdown-email" id="dropdownEmail">email@exemple.com</div>
                      <div class="dropdown-role" id="dropdownRole">Rôle</div>
                  </div>
              </div>
              <a href="/profile" class="dropdown-item">👤 Mon profil</a>
              <a href="/change-password" class="dropdown-item">🔐 Changer le mot de passe</a>
              <div class="dropdown-divider"></div>
              <div class="dropdown-item theme-switch-item">
                  <span>🌙 Mode sombre</span>
                  <label class="switch">
                      <input type="checkbox" id="themeSwitch">
                      <span class="slider"></span>
                  </label>
              </div>
              <div class="dropdown-divider"></div>
              <button id="logoutDropdownBtn" class="dropdown-item logout-item">🚪 Déconnexion</button>
          </div>
      </div>
  </div>
</header>

<style>
.top-bar {
  position: sticky;
  top: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 50;
}

.menu-toggle {
  display: none;
  background: none;
  border: none;
  font-size: 1.25rem;
  cursor: pointer;
  color: var(--text-primary);
}

.page-title h1 {
  font-size: 1.25rem;
  font-weight: 600;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* Recherche */
.search-wrapper {
  position: relative;
}

.search-input {
  padding: 0.5rem 2rem 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 2rem;
  background: var(--bg-card);
  font-size: 0.85rem;
  width: 250px;
}

.search-icon {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.85rem;
  opacity: 0.6;
}

/* Notifications */
.notification-wrapper {
  position: relative;
}

.notification-btn {
  background: none;
  border: none;
  font-size: 1.25rem;
  cursor: pointer;
  padding: 0.5rem;
  border-radius: 50%;
  position: relative;
}

.notification-btn:hover {
  background: var(--border-light);
}

.notification-badge {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--danger);
  color: white;
  font-size: 0.6rem;
  font-weight: 600;
  min-width: 18px;
  height: 18px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
}

.notifications-panel {
  position: absolute;
  top: 45px;
  right: 0;
  width: 380px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 200;
  overflow: hidden;
}

.notifications-panel.show {
  display: block;
  animation: fadeInUp 0.2s ease;
}

.notifications-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notifications-list {
  max-height: 400px;
  overflow-y: auto;
}

.notification-item {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: background var(--transition);
}

.notification-item:hover {
  background: var(--border-light);
}

.notification-item.unread {
  background: var(--primary-light);
}

/* Profil */
.profile-wrapper {
  position: relative;
}

.profile-btn {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem 0.75rem;
  border-radius: 2rem;
}

.profile-btn:hover {
  background: var(--border-light);
}

.profile-avatar {
  width: 32px;
  height: 32px;
  background: var(--primary);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.profile-name {
  font-size: 0.85rem;
  font-weight: 500;
}

.profile-dropdown {
  position: absolute;
  top: 45px;
  right: 0;
  width: 280px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: none;
  z-index: 200;
}

.profile-dropdown.show {
  display: block;
  animation: fadeInUp 0.2s ease;
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 1rem;
  text-decoration: none;
  color: var(--text-primary);
  transition: background var(--transition);
  cursor: pointer;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
}

.dropdown-item:hover {
  background: var(--border-light);
}

/* Switch dark mode */
.switch {
  position: relative;
  display: inline-block;
  width: 46px;
  height: 24px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.3s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: 0.3s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--primary);
}

input:checked + .slider:before {
  transform: translateX(22px);
}

.theme-switch-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Responsive */
@media (max-width: 768px) {
  .menu-toggle {
      display: block;
  }
  .search-input {
      width: 150px;
  }
  .profile-name {
      display: none;
  }
  .notifications-panel,
  .profile-dropdown {
      width: calc(100vw - 2rem);
      right: 1rem;
      left: 1rem;
  }
}
</style>
